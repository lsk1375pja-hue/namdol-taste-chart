<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>남돌 취향표</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <div class="eyebrow">BOYS PREFERENCE CHART</div>
        <h1 id="title">남돌 취향표</h1>
        <p>이름을 고른 뒤 그룹별로 멤버를 클릭하면 취향표가 완성됩니다.</p>
      </div>
      <div class="actions">
        <button id="saveBtn" class="primary">저장</button>
        <button id="pngBtn">이미지 저장</button>
        <button id="resetBtn">초기화</button>
      </div>
    </header>

    <section class="picker">
      <div class="picker-title">누구의 취향표인가요?</div>
      <div id="voterList" class="voter-list"></div>
    </section>

    <section id="chartSection" class="hidden">
      <div class="chart-top">
        <div>
          <h2 id="selectedVoter"></h2>
          <span class="hint">각 그룹에서 한 명을 선택하세요.</span>
        </div>
        <div class="progress" id="progress"></div>
      </div>

      <div id="chartCapture" class="chart-card">
        <div id="chart" class="chart"></div>
      </div>

      <div class="mobile-hint">좌우로 밀어서 다른 그룹을 볼 수 있어요.</div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
